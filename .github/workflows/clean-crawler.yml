name: Check In

# ✅ 手动续期 / 清理：运行此 workflow 可立即重置 365 天计时，保持 "Get Hot News" 正常运行
# ✅ Manual renewal / cleanup: Run this workflow to reset the 365-day timer immediately and keep "Get Hot News" active
#
# 📌 操作方法 / How to use:
#   1. 点击 "Run workflow" 按钮 / Click "Run workflow" button
#   2. 正常情况下无需手动运行，到期会自动续期 / Usually no manual run is needed because renewal is automatic on expiry

on:
  workflow_dispatch:

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete all workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
          delete_workflow_by_state_pattern: "ALL"
          delete_run_by_conclusion_pattern: "ALL"
